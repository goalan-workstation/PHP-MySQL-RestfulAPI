<!-- skin/body_album_detail.html : 相簿內頁 -->
<section class="about-section" id="albumDetail">
  <div class="about-section-head">
    <h2>{{TITLE}}</h2>
    <nav><a href="{{HOME_URL}}">首頁</a> / <a href="{{ALBUM_LIST_URL}}">相簿</a> / 內文</nav>
  </div>
  <p class="sub">共 {{PHOTO_COUNT}} 張照片</p>

  <!-- Photo Grid + Pagination -->
  <div id="photoSection" style="margin-top:24px">
    <div id="photoNav" style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px">
      <button id="photoPrevBtn" aria-label="上一頁"
        style="width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);
               background:var(--surface);color:var(--primary);cursor:pointer;
               font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
               transition:all .2s;flex-shrink:0">‹</button>
      <span id="photoPageInd"
        style="font-size:13px;color:var(--text-secondary);min-width:52px;text-align:center;font-variant-numeric:tabular-nums"></span>
      <button id="photoNextBtn" aria-label="下一頁"
        style="width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);
               background:var(--surface);color:var(--primary);cursor:pointer;
               font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
               transition:all .2s;flex-shrink:0">›</button>
    </div>
    <div id="photoGrid" class="photo-grid"></div>
  </div>

  <div class="back-wrap">
    <a class="back-btn" href="{{BACK_URL}}">← 返回相簿列表</a>
  </div>
</section>

<!-- Lightbox Overlay -->
<div id="lightbox"
  style="display:none;position:fixed;inset:0;z-index:9999;
         background:rgba(0,0,0,0.93);align-items:center;justify-content:center;
         flex-direction:column">
  <!-- Close button -->
  <button id="lbCloseBtn"
    style="position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;
           border:none;background:rgba(255,255,255,0.1);color:#fff;font-size:20px;
           cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;
           transition:background .2s">✕</button>
  <!-- Left arrow -->
  <button id="lbPrevBtn"
    style="position:absolute;left:14px;top:50%;transform:translateY(-50%);width:50px;height:50px;
           border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#fff;
           font-size:32px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;
           transition:background .2s;line-height:1">‹</button>
  <!-- Image -->
  <img id="lbImg"
    style="max-width:92vw;max-height:76vh;object-fit:contain;border-radius:10px;
           box-shadow:0 10px 50px rgba(0,0,0,0.55);opacity:0;transition:opacity .3s;user-select:none">
  <!-- Right arrow -->
  <button id="lbNextBtn"
    style="position:absolute;right:14px;top:50%;transform:translateY(-50%);width:50px;height:50px;
           border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#fff;
           font-size:32px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;
           transition:background .2s;line-height:1">›</button>
  <!-- Counter -->
  <div id="lbCounter"
    style="position:absolute;bottom:20px;left:0;right:0;text-align:center;
           color:rgba(255,255,255,0.45);font-size:13px;pointer-events:none;letter-spacing:.5px"></div>
</div>
