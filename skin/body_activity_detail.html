<!-- skin/body_activity_detail.html : 最新活動內頁 -->
<section class="about-section" id="activityDetail">
  <div class="about-section-head">
    <h2>{{TITLE}}</h2>
    <nav><a href="{{HOME_URL}}">首頁</a> / <a href="{{ACTIVITY_LIST_URL}}">最新活動</a> / 內文</nav>
  </div>
  <p class="sub">{{TITLE_2}}</p>
  <p class="meta">發布：{{CREAT_TIME}}　更新：{{UPDAT_TIME}}</p>
  <p><img src="{{ACTIVITY_PIC}}" alt="{{TITLE}}" style="max-width:100%;border-radius:12px;" onerror="this.style.display='none';"></p>
  <div class="about-content"><div class="about-text">{{DESCRIPTION}}</div></div>
  <div class="back-wrap">
    <a class="back-btn" href="{{BACK_URL}}">← 返回最新活動列表</a>
  </div>
</section>
