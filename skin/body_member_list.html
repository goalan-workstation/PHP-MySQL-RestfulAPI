<!-- skin/body_member_list.html : 會員登入 / 專區 -->
<section class="about-section" id="memberArea">
  <div class="about-section-head">
    <h2>會員專區</h2>
    <nav><a href="{{HOME_URL}}">首頁</a> / 會員專區</nav>
  </div>

  <!-- 未登入：登入 + 註冊 -->
  <div id="memberLogin" style="{{LOGIN_STYLE}}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:720px;flex-wrap:wrap;">

      <!-- 登入表單 -->
      <div style="background:var(--surface);border-radius:12px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.06);">
        <h3 style="margin:0 0 20px;font-size:18px;">登入</h3>
        <form id="memberLoginForm">
          <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}">
          <div class="form-group">
            <label>帳號</label>
            <input type="text" name="user_id" required autocomplete="username" minlength="4" maxlength="20" pattern="[A-Za-z0-9._-]{4,20}" title="4-20 字元，僅英數及 ._ -">
          </div>
          <div class="form-group">
            <label>密碼</label>
            <input type="password" name="user_pwd" required autocomplete="current-password" minlength="6">
          </div>
          <p id="loginMsg" style="font-size:13px;margin:6px 0;min-height:22px;color:var(--text-secondary);"></p>
          <button type="submit" class="button button-primary" style="width:100%;">登入</button>
        </form>
        <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:18px;">
          <p style="text-align:center;margin-top:0;">
            <a href="javascript:void(0)" id="forgotToggle" style="font-size:13px;color:var(--text-secondary);text-decoration:underline;">忘記密碼？</a>
          </p>
        </div>
      </div>

      <!-- 註冊表單 -->
      <div style="background:var(--surface);border-radius:12px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.06);">
        <h3 style="margin:0 0 20px;font-size:18px;">註冊新會員</h3>
        <form id="memberRegisterForm">
          <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}">
          <div class="form-group">
            <label>暱稱</label>
            <input type="text" name="member_name" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="member_email" required>
          </div>
          <div class="form-group">
            <label>帳號（登入用）</label>
            <input type="text" name="user_id" required>
          </div>
          <div class="form-group">
            <label>密碼</label>
            <input type="password" name="user_pwd" required minlength="6" autocomplete="new-password">
          </div>
          <p id="regMsg" style="font-size:13px;margin:6px 0;min-height:22px;color:var(--text-secondary);"></p>
          <button type="submit" class="button button-primary" style="width:100%;">註冊</button>
        </form>
        <p style="font-size:12px;color:var(--text-secondary);margin-top:12px;line-height:1.5;">
          註冊後將寄送確認信，請開啟信箱點按啟用連結後才能正式登入。
        </p>
      </div>
    </div>

    <!-- 忘記密碼表單（預設隱藏） -->
    <div id="forgotPanel" style="display:none;max-width:360px;margin-top:24px;background:var(--surface);border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);">
      <h3 style="margin:0 0 16px;font-size:16px;">忘記密碼</h3>
      <form id="memberForgotForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="member_email" required>
        </div>
        <p id="forgotMsg" style="font-size:13px;margin:6px 0;min-height:22px;color:var(--text-secondary);"></p>
        <div style="display:flex;gap:12px;">
          <button type="submit" class="button button-primary" style="flex:1;">發送重置連結</button>
          <button type="button" id="forgotCancel" class="button button-secondary" style="flex:1;">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 已登入：會員儀表板 -->
  <div id="memberDash" style="{{DASH_STYLE}}">
    <p style="font-size:15px;margin-bottom:16px;">歡迎，<strong>{{MEMBER_NAME}}</strong>！</p>

    <!-- 功能按鈕 -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;">
      <a class="button button-primary" href="#orderSection">購買紀錄清單</a>
      <a class="button button-secondary" href="{{MEMBER_EDIT_URL}}">修改會員資料</a>
      <a class="button button-secondary" href="skin/body_member_list.php?action=logout">登出</a>
    </div>

    <!-- 歷史購買紀錄 -->
    <div id="orderSection">
      <h3 style="margin:0 0 14px;font-size:17px;">歷史購買紀錄</h3>
      <div id="orderList">
        <!-- BEGIN ROW_ORDER -->
        <div class="card" style="margin-bottom:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div>
            <strong style="font-size:14px;">訂單 {{ORDER_CODE}}</strong>
            <span style="font-size:12px;color:var(--text-secondary);margin-left:10px;">{{ORDER_TIME}}</span>
          </div>
          <div style="display:flex;gap:16px;align-items:center;">
            <span style="font-size:13px;color:var(--text-secondary);">{{ORDER_COUNT}} 件</span>
            <span style="font-size:13px;color:var(--text-secondary);">{{ORDER_STATUS}}</span>
          </div>
        </div>
        <!-- END ROW_ORDER -->
      </div>
      <p id="orderEmpty" style="text-align:center;color:var(--text-secondary);padding:24px;font-size:14px;">目前沒有購買紀錄。</p>
      <nav class="pager" id="orderPager">{{ORDER_PAGER}}</nav>
    </div>

    <p id="logoutMsg" style="font-size:14px;margin-top:16px;min-height:20px;color:var(--text-secondary);"></p>
  </div>
</section>
