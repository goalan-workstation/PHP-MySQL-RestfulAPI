name: alan-php-mysql

services:
  db:
    image: mariadb:10.4.32
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: alan_php
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-alan1123}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./SYSTEM/database/default_table.sql:/docker-entrypoint-initdb.d/10-default.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: alan_php
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-alan1123}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - activity_uploads:/var/www/html/SYSTEM/activity/img
      - album_uploads:/var/www/html/SYSTEM/album/img
      - album_sub_uploads:/var/www/html/SYSTEM/album_sub/img
      - news_uploads:/var/www/html/SYSTEM/news/img
      - news_2_uploads:/var/www/html/SYSTEM/news_2/img
      - product_uploads:/var/www/html/SYSTEM/product/img

volumes:
  mysql_data:
  activity_uploads:
  album_uploads:
  album_sub_uploads:
  news_uploads:
  news_2_uploads:
  product_uploads: